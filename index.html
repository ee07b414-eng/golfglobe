<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eaf6ee">
<title>GolfGlobe</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07130b;background:radial-gradient(circle at 78% 10%,#ffe0c8,transparent 260px),linear-gradient(#f8fbff,#edf7f0 60%,#fbfdfb)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:28px 18px 46px}.hero{display:grid;grid-template-columns:1fr 150px;gap:16px;align-items:center}.eyebrow{margin:0 0 6px;color:#229954;font-weight:800}.hero h1{margin:0;font-size:clamp(48px,9vw,92px);line-height:.92}.hero p{color:#69766f}.buddy{height:130px;border-radius:50%;position:relative}.buddy:before{content:"";position:absolute;right:18px;top:22px;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#e8f9e6);box-shadow:0 12px 24px #195b2a22}.buddy:after{content:"⚑";position:absolute;right:1px;top:43px;color:#f47b27;font-size:38px}.face{position:absolute;right:43px;top:53px;font-size:30px;z-index:1}.cap{position:absolute;right:36px;top:16px;width:76px;height:18px;border-radius:50%;background:#45a95d}.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:850;background:#1f9146;color:white}.btn.alt{background:#e4f2e8;color:#0b3b1d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.panel,.card{border:1px solid #1743281a;border-radius:8px;background:#ffffffd9;box-shadow:0 18px 45px #1d54331a}.stat{padding:16px;min-height:96px}.stat b{display:block;font-size:34px}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.75fr);gap:16px}.panel{padding:16px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:start}.bar h2,.form h2,.recent h2{margin:0 0 6px}.muted{color:#69766f}.stage{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;overflow:hidden;background:radial-gradient(circle,#e6f8ff,transparent 54%),linear-gradient(#f9ffff,#d7eee6)}canvas{width:100%;height:100%;touch-action:none}.form{display:grid;gap:10px}.form label{display:grid;gap:5px;color:#69766f;font-weight:750}.form input,.form select,.form textarea{width:100%;border:1px solid #173d221f;border-radius:8px;padding:10px;background:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{min-height:116px;border:1px dashed #1b713855;border-radius:8px;display:grid;place-items:center;color:white;font-weight:850;background:linear-gradient(135deg,#184d2d,#9ac37f);background-size:cover;background-position:center}.recent{margin-top:18px}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;padding:10px;text-align:left}.thumb{width:72px;height:72px;border-radius:8px;background:linear-gradient(135deg,#215d38,#a8d27d);background-size:cover;background-position:center}.card h3{margin:0 0 4px;font-size:16px}.score{font-weight:850;color:#0b3b1d}.pill{padding:2px 7px;border-radius:99px;background:#e5f4e9;color:#168442}dialog{width:min(560px,calc(100vw - 28px));border:0;border-radius:8px;padding:0;box-shadow:0 30px 80px #061b0d55}dialog::backdrop{background:#03110866}.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border:0;border-radius:50%;background:white;font-size:24px}.cover{height:245px;background:linear-gradient(135deg,#174d2b,#a6ca87);background-size:cover;background-position:center}.body{padding:18px}.detailGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.detailGrid div{background:#f0f7f2;border-radius:8px;padding:12px}.toast{position:fixed;right:16px;bottom:16px;background:white;border:1px solid #1743281a;border-radius:8px;padding:12px 14px;box-shadow:0 16px 38px #061b0d2b;opacity:0;transform:translateY(8px);transition:.2s}.toast.on{opacity:1;transform:none}@media(max-width:720px){body{padding-bottom:82px}.app{padding:20px 12px}.hero{grid-template-columns:1fr 96px}.buddy{height:96px}.hero h1{font-size:48px}.stats{gap:8px}.stat{padding:12px}.stat b{font-size:28px}.grid{grid-template-columns:1fr}.two,.detailGrid{grid-template-columns:1fr}.list{grid-template-columns:1fr}.nav{display:grid!important}}.nav{display:none;position:fixed;left:12px;right:12px;bottom:12px;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px;background:#ffffffe8;border:1px solid #1743281a;border-radius:8px;box-shadow:0 12px 32px #061b0d22}.nav button{border:0;border-radius:8px;background:transparent;padding:10px;font-weight:850}.nav button.on{background:#e4f2e8;color:#0b3b1d}@media(max-width:720px){body[data-tab=globe] .formPanel,body[data-tab=globe] .recent,body[data-tab=form] .globePanel,body[data-tab=form] .recent{display:none}body[data-tab=list] .grid{display:none}}
</style>
</head>
<body data-tab="globe">
<main class="app">
<section class="hero"><div><p class="eyebrow">世界球场打卡日志</p><h1>GolfGlobe</h1><p>上传照片，记录杆数，把每一座球场钉在地球上。</p><button class="btn" id="addBtn">新增打卡</button></div><div class="buddy"><i class="cap"></i><i class="face">⌣</i></div></section>
<section class="stats"><div class="stat"><span>⚑</span><b id="c1">0</b><span class="muted">球场</span></div><div class="stat"><span>⌖</span><b id="c2">0</b><span class="muted">国家</span></div><div class="stat"><span>◌</span><b id="c3">-</b><span class="muted">平均杆</span></div></section>
<section class="grid"><div class="panel globePanel"><div class="bar"><div><h2>打卡地球</h2><p class="muted" id="hint">拖动地球，点击旗帜看照片和杆数。</p></div><button class="btn alt" id="reset">重置示例</button></div><div class="stage"><canvas id="globe" width="760" height="760"></canvas></div></div>
<aside class="panel formPanel"><form class="form" id="form"><h2>新增球场打卡</h2><label>照片<input id="photo" type="file" accept="image/*"></label><div class="photo" id="preview">选择照片</div><label>经典球场<select id="preset"></select></label><label>球场名称<input id="name" required></label><div class="two"><label>城市<input id="city"></label><label>国家<input id="country"></label></div><div class="two"><label>纬度<input id="lat" inputmode="decimal" required></label><label>经度<input id="lon" inputmode="decimal" required></label></div><div class="two"><label>本次杆数<input id="strokes" inputmode="numeric" required></label><label>标准杆<input id="par" inputmode="numeric" required></label></div><label>备注<textarea id="note" rows="3"></textarea></label><button class="btn">保存打卡</button></form></aside></section>
<section class="recent"><h2>最近打卡</h2><p class="muted">点开球场查看照片、杆数和备注。</p><div class="list" id="list"></div></section>
</main>
<dialog id="dlg"><button class="x" id="close">×</button><div id="detail"></div></dialog>
<nav class="nav"><button data-tab="globe" class="on">地球</button><button data-tab="form">打卡</button><button data-tab="list">相册</button></nav><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),key="golfglobe.lite.v1",courses=[
["St Andrews Old Course","St Andrews","Scotland",56.3432,-2.8031,84,72,"风很硬，后九洞终于把推杆稳住了。"],
["Pebble Beach Golf Links","Pebble Beach","United States",36.5688,-121.9506,89,72,"18 洞海景太漂亮，第二杆需要更保守。"],
["Mission Hills World Cup Course","Shenzhen","China",22.7425,114.057,81,72,"果岭速度比预期快，铁杆状态不错。"],
["Royal Melbourne West","Melbourne","Australia",-37.9717,145.0346,86,72,"砂带球场策略感很强。"]
],E=["name","city","country","lat","lon","strokes","par","note"].reduce((o,id)=>(o[id]=$(id),o),{});let photo=null,yaw=-40,pitch=12,drag=null,marks=[];
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function seed(){return courses.slice(0,3).map(c=>({id:id(),name:c[0],city:c[1],country:c[2],lat:c[3],lon:c[4],strokes:c[5],par:c[6],note:c[7],photo:null,date:"2026-05-11"}))}
function load(){if(location.search.includes("fresh=1"))localStorage.removeItem(key);try{let x=JSON.parse(localStorage.getItem(key)||"null");return x&&x.length?x:seed()}catch{return seed()}}
let data=load(),sel=data[0]?.id;function save(){localStorage.setItem(key,JSON.stringify(data))}
function toast(t){$("toast").textContent=t;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),1800)}
function score(x){let d=x.strokes-x.par;return d?d>0?`+${d}`:d:"E"}function loc(x){return[x.city,x.country].filter(Boolean).join(", ")}
function fill(i=0){let c=courses[i];["name","city","country"].forEach((k,j)=>E[k].value=c[j]);E.lat.value=c[3];E.lon.value=c[4];E.strokes.value=c[5];E.par.value=c[6];E.note.value=c[7]}
function render(){let countries=new Set(data.map(x=>x.country).filter(Boolean));$("c1").textContent=data.length;$("c2").textContent=countries.size;$("c3").textContent=data.length?Math.round(data.reduce((s,x)=>s+x.strokes,0)/data.length):"-";let s=data.find(x=>x.id===sel);$("hint").textContent=s?`${s.name} · ${s.strokes} 杆 · ${score(s)}`:"拖动地球，点击旗帜看照片和杆数。";$("list").innerHTML=data.map(x=>`<button class="card" data-id="${x.id}"><i class="thumb" style="${x.photo?`background-image:url(${x.photo})`:""}"></i><span><h3>${x.name}</h3><p class="muted">${loc(x)}</p><span class="score">${x.strokes} 杆 <b class="pill">${score(x)}</b></span></span></button>`).join("");document.querySelectorAll(".card").forEach(b=>b.onclick=()=>open(b.dataset.id));draw()}
function project(lat,lon,w){let r=w*.42,c=w/2,la=lat*Math.PI/180,lo=lon*Math.PI/180,la0=pitch*Math.PI/180,lo0=yaw*Math.PI/180,d=lo-lo0,z=Math.sin(la0)*Math.sin(la)+Math.cos(la0)*Math.cos(la)*Math.cos(d);if(z<-.04)return null;return{x:c+r*Math.cos(la)*Math.sin(d),y:c-r*(Math.cos(la0)*Math.sin(la)-Math.sin(la0)*Math.cos(la)*Math.cos(d)),z}}
function draw(){let cv=$("globe"),g=cv.getContext("2d"),w=cv.width;g.clearRect(0,0,w,w);let c=w/2,r=w*.42,gr=g.createRadialGradient(c-r*.3,c-r*.4,20,c,c,r*1.2);gr.addColorStop(0,"#8fe5ff");gr.addColorStop(.5,"#1d78b3");gr.addColorStop(1,"#061331");g.fillStyle=gr;g.beginPath();g.arc(c,c,r,0,7);g.fill();g.save();g.beginPath();g.arc(c,c,r,0,7);g.clip();for(let a=-60;a<=60;a+=30)line([...Array(73)].map((_,i)=>[a,-180+i*5]),"#ffffff33",1);for(let a=-180;a<=180;a+=30)line([...Array(37)].map((_,i)=>[-90+i*5,a]),"#ffffff22",1);[[52,-105,25,54],[6,20,38,28],[48,93,31,55],[-15,-60,34,18],[-25,134,17,25],[52,13,17,22]].forEach(m=>{g.fillStyle="#75b85acc";for(let i=0;i<520;i++){let lat=m[0]+(Math.random()-.5)*m[2]*2,lon=m[1]+(Math.random()-.5)*m[3]*2,p=project(lat,lon,w);if(p){g.beginPath();g.arc(p.x,p.y,2+p.z*2,0,7);g.fill()}}});g.restore();g.strokeStyle="#fff8";g.lineWidth=2;g.beginPath();g.arc(c,c,r,0,7);g.stroke();marks=[];data.forEach(x=>{let p=project(+x.lat,+x.lon,w);if(!p)return;marks.push({...p,id:x.id});g.globalAlpha=.45+p.z*.55;g.fillStyle="#fff";g.beginPath();g.arc(p.x,p.y,18,0,7);g.fill();g.fillStyle="#25a95a";g.font="24px sans-serif";g.fillText("⚑",p.x-11,p.y+8);g.globalAlpha=1})}
function line(arr,col,lw){let g=$("globe").getContext("2d"),on=0;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();arr.forEach(a=>{let p=project(a[0],a[1],$("globe").width);if(!p){on=0;return}on?g.lineTo(p.x,p.y):(g.moveTo(p.x,p.y),on=1)});g.stroke()}
function open(idv){let x=data.find(i=>i.id===idv);if(!x)return;sel=x.id;render();$("detail").innerHTML=`<div class="cover" style="${x.photo?`background-image:url(${x.photo})`:""}"></div><div class="body"><h2>${x.name}</h2><p class="muted">${loc(x)}</p><div class="detailGrid"><div><small>本次杆数</small><b>${x.strokes}</b></div><div><small>标准杆</small><b>${x.par}</b></div><div><small>相对标准杆</small><b>${score(x)}</b></div></div><p>${x.note||"这次还没有写备注。"}</p><p class="muted">${(+x.lat).toFixed(4)}, ${(+x.lon).toFixed(4)}</p></div>`;$("dlg").showModal()}
$("preset").innerHTML=courses.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join("");$("preset").onchange=e=>fill(+e.target.value);fill();$("addBtn").onclick=()=>tab("form");$("reset").onclick=()=>{localStorage.removeItem(key);data=seed();sel=data[0].id;save();render();toast("示例已重置")};$("photo").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{photo=r.result;$("preview").style.backgroundImage=`url(${photo})`;$("preview").textContent=""};r.readAsDataURL(f)};$("form").onsubmit=e=>{e.preventDefault();let x={id:id(),photo,date:new Date().toISOString().slice(0,10)};Object.keys(E).forEach(k=>x[k]=E[k].value.trim());x.lat=+x.lat;x.lon=+x.lon;x.strokes=+x.strokes;x.par=+x.par;data.unshift(x);sel=x.id;photo=null;$("preview").removeAttribute("style");$("preview").textContent="选择照片";save();render();tab("globe");toast("已保存打卡")};$("close").onclick=()=>$("dlg").close();document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));function tab(t){document.body.dataset.tab=t;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));setTimeout(()=>draw(),50)}$("globe").onpointerdown=e=>drag=[e.clientX,e.clientY,yaw,pitch];$("globe").onpointermove=e=>{if(!drag)return;yaw=drag[2]-(e.clientX-drag[0])*.45;pitch=Math.max(-60,Math.min(60,drag[3]+(e.clientY-drag[1])*.25));draw()};onpointerup=()=>drag=null;$("globe").onclick=e=>{let r=$("globe").getBoundingClientRect(),s=$("globe").width/r.width,x=(e.clientX-r.left)*s,y=(e.clientY-r.top)*s,m=marks.find(p=>Math.hypot(p.x-x,p.y-y)<28);if(m)open(m.id)};render();
</script>
</body>
</html>
