<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eaf6ee">
<title>GolfGlobe</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--ink:#07130b;--muted:#66746d;--green:#238b4d;--deep:#0d3e2a;--blue:#115c9c;--amber:#f0b12d;--coral:#ec644b;--line:#173d221f;--card:#ffffffdd}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 82% 8%,#ffcfb5 0 140px,transparent 300px),radial-gradient(circle at 10% 14%,#c8f3ff 0 120px,transparent 300px),linear-gradient(#f8fbff,#edf7f0 58%,#fbfdfb);overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:22px 18px 46px;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--deep)}
.logo{width:40px;height:40px;border-radius:9px;background:linear-gradient(135deg,#1e8b47,#7bd176);position:relative;box-shadow:inset 0 -6px 0 #0c6635}
.logo:before{content:"";position:absolute;left:12px;top:9px;width:16px;height:16px;border-radius:50%;background:white;box-shadow:0 0 0 2px #d8eee0}
.logo:after{content:"";position:absolute;left:22px;top:7px;width:3px;height:24px;background:#072c19;box-shadow:8px 5px 0 #f5f7f2}
.authBox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;background:#ffffffd9;padding:8px 10px;box-shadow:0 12px 30px #1d543314}
.authText{font-size:13px;color:var(--muted)}
.authText b{display:block;color:var(--deep);font-size:14px}
.authActions{display:flex;gap:7px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;align-items:center;position:relative}
.eyebrow{margin:0 0 6px;color:#229954;font-weight:900}
.hero h1{margin:0;font-size:clamp(48px,9vw,92px);line-height:.92;letter-spacing:0}
.hero p{color:var(--muted);max-width:560px}
.buddy{height:176px;border-radius:8px;position:relative;overflow:hidden;background:linear-gradient(#93dcff,#e8fff4 58%,#80c95e 59%);border:1px solid var(--line);box-shadow:0 18px 45px #1d54331a}
.buddy:before{content:"";position:absolute;right:42px;top:46px;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff,#e8f9e6);box-shadow:0 12px 24px #195b2a22,10px 0 0 #d6ecd5}
.buddy:after{content:"";position:absolute;right:24px;top:72px;width:22px;height:48px;background:#16351f;border-radius:8px 8px 0 0;box-shadow:8px 0 0 #fff,15px 0 0 #16351f}
.face{position:absolute;right:67px;top:80px;font-size:30px;z-index:1}
.cap{position:absolute;right:56px;top:34px;width:78px;height:20px;border-radius:50% 50% 8px 8px;background:#e94f3d;box-shadow:28px 8px 0 -4px #b92d25;z-index:2}
.tile{position:absolute;width:36px;height:36px;border-radius:4px;background:#f2b935;border:3px solid #8c5d14;box-shadow:inset 0 -7px 0 #d69222,0 5px 0 #6e3f0e}
.tile:before{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-weight:1000;color:white;text-shadow:2px 2px 0 #8c5d14}
.tile.one{left:18px;top:24px}.tile.two{left:62px;top:54px;transform:scale(.72)}.tile.three{right:12px;bottom:24px;transform:scale(.58)}
.cloud{position:absolute;left:16px;bottom:44px;width:60px;height:22px;background:white;border-radius:4px;box-shadow:16px -12px 0 white,34px -6px 0 white,0 4px 0 #b7dfef,16px -8px 0 #b7dfef,34px -2px 0 #b7dfef}
.mush{position:absolute;left:92px;bottom:21px;width:48px;height:34px;border-radius:28px 28px 10px 10px;background:#ff6d54;border:3px solid #81311f;box-shadow:inset 0 -6px 0 #d94c3c}
.mush:before{content:"";position:absolute;left:8px;top:7px;width:10px;height:10px;border-radius:50%;background:white;box-shadow:18px 0 0 white}
.mush:after{content:"";position:absolute;left:14px;bottom:-14px;width:18px;height:16px;border-radius:4px;background:#fff1cf;border:3px solid #81311f;border-top:0}
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:900;background:#1f9146;color:white;box-shadow:inset 0 -3px 0 #0a642e}
.btn.alt{background:#e4f2e8;color:#0b3b1d;box-shadow:none}
.btn.small{padding:8px 11px;font-size:13px}
.btn.warn{background:#ec644b;box-shadow:inset 0 -3px 0 #b23a28}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.stat,.panel,.card,.geoBox{border:1px solid var(--line);border-radius:8px;background:var(--card);box-shadow:0 18px 45px #1d54331a}
.stat{padding:16px;min-height:96px;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;right:-14px;bottom:-14px;width:54px;height:54px;border-radius:50%;background:#f0b12d22}
.stat b{display:block;font-size:34px}
.pixelIcon{font-weight:1000;color:var(--coral)}
.grid{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(330px,.72fr);gap:16px}
.panel{padding:16px}
.bar{display:flex;justify-content:space-between;gap:12px;align-items:start}
.bar h2,.form h2,.recent h2{margin:0 0 6px}
.muted{color:var(--muted)}
.stage{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#e7f9ff 0 30%,#bfe8f1 58%,#7cc5d5 100%);position:relative;border:1px solid #d6ece2}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 47%,#ffffff2b 47% 49%,transparent 49% 100%),linear-gradient(0deg,transparent 0 47%,#ffffff26 47% 49%,transparent 49% 100%);background-size:72px 72px;mix-blend-mode:screen;pointer-events:none}
canvas{width:100%;height:100%;touch-action:none;position:relative;z-index:1}
.geoBox{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:12px;overflow:hidden}
.geoBox div{padding:12px;border-right:1px solid var(--line);min-width:0}
.geoBox div:last-child{border-right:0}
.geoBox small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}
.geoBox b{display:block;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form{display:grid;gap:10px}
.form label,.authForm label{display:grid;gap:5px;color:var(--muted);font-weight:800}
.form input,.form select,.form textarea,.authForm input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:white}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{min-height:116px;border:1px dashed #1b713855;border-radius:8px;display:grid;place-items:center;color:white;font-weight:900;background:linear-gradient(135deg,#184d2d,#9ac37f);background-size:cover;background-position:center;text-shadow:0 1px 2px #072c19}
.recent{margin-top:18px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;padding:10px;text-align:left;border:1px solid var(--line)}
.card:hover{transform:translateY(-1px)}
.thumb{width:72px;height:72px;border-radius:8px;background:linear-gradient(135deg,#215d38,#a8d27d);background-size:cover;background-position:center;position:relative;overflow:hidden}
.thumb:after{content:"⚑";position:absolute;right:6px;bottom:4px;color:white;text-shadow:0 2px 3px #072c19}
.card h3{margin:0 0 4px;font-size:16px}
.score{font-weight:900;color:#0b3b1d}
.pill{padding:2px 7px;border-radius:99px;background:#e5f4e9;color:#168442}
dialog{width:min(560px,calc(100vw - 28px));border:0;border-radius:8px;padding:0;box-shadow:0 30px 80px #061b0d55}
dialog::backdrop{background:#03110866}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border:0;border-radius:50%;background:white;font-size:24px;z-index:2}
.cover{height:245px;background:linear-gradient(135deg,#174d2b,#a6ca87);background-size:cover;background-position:center}
.body{padding:18px}
.detailGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.detailGrid div{background:#f0f7f2;border-radius:8px;padding:12px}
.detailGrid small{display:block;color:var(--muted);font-weight:800}
.authBody{padding:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.seg button{border:0;border-radius:8px;background:#edf4ef;padding:10px;font-weight:900;color:#0b3b1d}
.seg button.on{background:#1f9146;color:white}
.authForm{display:grid;gap:10px}
.authMsg{min-height:20px;color:var(--coral);font-weight:800;margin:0}
.toast{position:fixed;right:16px;bottom:16px;background:white;border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:0 16px 38px #061b0d2b;opacity:0;transform:translateY(8px);transition:.2s;z-index:4}
.toast.on{opacity:1;transform:none}
.nav{display:none;position:fixed;left:12px;right:12px;bottom:12px;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px;background:#ffffffe8;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px #061b0d22;z-index:3}
.nav button{border:0;border-radius:8px;background:transparent;padding:10px;font-weight:900}
.nav button.on{background:#e4f2e8;color:#0b3b1d}
@media(max-width:860px){.hero{grid-template-columns:1fr}.buddy{height:142px}.geoBox{grid-template-columns:1fr}.geoBox div{border-right:0;border-bottom:1px solid var(--line)}.geoBox div:last-child{border-bottom:0}}
@media(max-width:720px){body{padding-bottom:82px}.app{padding:18px 12px}.topbar{align-items:stretch;flex-direction:column}.authBox{justify-content:space-between}.hero h1{font-size:48px}.stats{gap:8px}.stat{padding:12px}.stat b{font-size:28px}.grid{grid-template-columns:1fr}.two,.detailGrid{grid-template-columns:1fr}.list{grid-template-columns:1fr}.nav{display:grid}.bar{align-items:stretch;flex-direction:column}body[data-tab=globe] .formPanel,body[data-tab=globe] .recent,body[data-tab=form] .globePanel,body[data-tab=form] .recent{display:none}body[data-tab=list] .grid{display:none}}
</style>
</head>
<body data-tab="globe">
<main class="app">
<header class="topbar">
  <div class="brand"><i class="logo" aria-hidden="true"></i><span>GolfGlobe</span></div>
  <div class="authBox">
    <span class="authText" id="userState"><b>访客模式</b>数据保存在当前浏览器</span>
    <span class="authActions" id="authActions"><button class="btn small alt" id="loginBtn">登录</button><button class="btn small" id="registerBtn">注册</button></span>
    <button class="btn small warn" id="logoutBtn" hidden>退出</button>
  </div>
</header>
<section class="hero">
  <div>
    <p class="eyebrow">世界球场打卡日志</p>
    <h1>GolfGlobe</h1>
    <p>上传照片，记录杆数，把每一座球场钉在更真实的地球上。</p>
    <button class="btn" id="addBtn">新增打卡</button>
  </div>
  <div class="buddy" aria-hidden="true"><i class="tile one"></i><i class="tile two"></i><i class="tile three"></i><i class="cloud"></i><i class="mush"></i><i class="cap"></i><i class="face">⌣</i></div>
</section>
<section class="stats">
  <div class="stat"><span class="pixelIcon">⚑</span><b id="c1">0</b><span class="muted">球场</span></div>
  <div class="stat"><span class="pixelIcon">⌖</span><b id="c2">0</b><span class="muted">国家</span></div>
  <div class="stat"><span class="pixelIcon">◌</span><b id="c3">-</b><span class="muted">平均杆</span></div>
</section>
<section class="grid">
  <div class="panel globePanel">
    <div class="bar">
      <div><h2>打卡地球</h2><p class="muted" id="hint">拖动地球，点击旗帜看照片和杆数。</p></div>
      <button class="btn alt" id="reset">重置示例</button>
    </div>
    <div class="stage" id="globeStage"><canvas id="globe" width="760" height="760"></canvas></div>
    <div class="geoBox">
      <div><small>当前球场</small><b id="geoCourse">-</b></div>
      <div><small>国家 / 坐标</small><b id="geoLocation">-</b></div>
      <div><small>地理信息</small><b id="geoMeta">正在加载国家边界</b></div>
    </div>
  </div>
  <aside class="panel formPanel">
    <form class="form" id="form">
      <h2>新增球场打卡</h2>
      <label>照片<input id="photo" type="file" accept="image/*"></label>
      <div class="photo" id="preview">选择照片</div>
      <label>经典球场<select id="preset"></select></label>
      <label>球场名称<input id="name" required></label>
      <div class="two"><label>城市<input id="city"></label><label>国家<input id="country"></label></div>
      <div class="two"><label>纬度<input id="lat" inputmode="decimal" required></label><label>经度<input id="lon" inputmode="decimal" required></label></div>
      <div class="two"><label>本次杆数<input id="strokes" inputmode="numeric" required></label><label>标准杆<input id="par" inputmode="numeric" required></label></div>
      <label>备注<textarea id="note" rows="3"></textarea></label>
      <button class="btn">保存打卡</button>
    </form>
  </aside>
</section>
<section class="recent">
  <h2>最近打卡</h2>
  <p class="muted">点开球场查看照片、杆数、坐标和备注。</p>
  <div class="list" id="list"></div>
</section>
</main>
<dialog id="dlg"><button class="x" id="closeDetail">×</button><div id="detail"></div></dialog>
<dialog id="authDlg">
  <button class="x" id="authClose">×</button>
  <div class="authBody">
    <h2 id="authTitle">登录</h2>
    <div class="seg"><button type="button" data-mode="login" class="on">登录</button><button type="button" data-mode="register">注册</button></div>
    <form class="authForm" id="authForm">
      <label>用户名<input id="authUser" autocomplete="username" required></label>
      <label id="displayNameWrap" hidden>昵称<input id="authDisplay" autocomplete="nickname"></label>
      <label>密码<input id="authPass" type="password" autocomplete="current-password" required></label>
      <button class="btn" id="authSubmit">登录</button>
      <p class="authMsg" id="authMsg"></p>
    </form>
  </div>
</dialog>
<nav class="nav"><button data-tab="globe" class="on">地球</button><button data-tab="form">打卡</button><button data-tab="list">相册</button></nav>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const AUTH_KEY="golfglobe.accounts.v1",SESSION_KEY="golfglobe.session.v1",GUEST_KEY="golfglobe.guest.checkins.v2",LEGACY_KEY="golfglobe.lite.v1";
const courses=[
["St Andrews Old Course","St Andrews","Scotland",56.3432,-2.8031,84,72,"风很硬，后九洞终于把推杆稳住了。"],
["Pebble Beach Golf Links","Pebble Beach","United States",36.5688,-121.9506,89,72,"18 洞海景太漂亮，第二杆需要更保守。"],
["Mission Hills World Cup Course","Shenzhen","China",22.7425,114.057,81,72,"果岭速度比预期快，铁杆状态不错。"],
["Royal Melbourne West","Melbourne","Australia",-37.9717,145.0346,86,72,"砂带球场策略感很强。"],
["Kawana Fuji Course","Ito","Japan",34.9348,139.1421,88,72,"海边坡度变化很精彩，发球台视野很开。"]
];
const COUNTRY_ZH={"United States of America":"美国","United States":"美国","China":"中国","United Kingdom":"英国","Australia":"澳大利亚","Japan":"日本","Scotland":"苏格兰","Canada":"加拿大","Brazil":"巴西","India":"印度","Russia":"俄罗斯","France":"法国","Germany":"德国","South Africa":"南非","Argentina":"阿根廷","Spain":"西班牙","Italy":"意大利","Mexico":"墨西哥","New Zealand":"新西兰","Ireland":"爱尔兰","Portugal":"葡萄牙"};
const COUNTRY_ALIASES={Scotland:["United Kingdom","Scotland"],"United States":["United States of America","United States"],USA:["United States of America","United States"],China:["China"],Japan:["Japan"],Australia:["Australia"]};
const SIMPLE_COUNTRIES=[
{name:"Canada",poly:[[-141,69],[-62,69],[-55,53],[-69,44],[-95,49],[-124,49],[-141,60]]},
{name:"United States of America",poly:[[-125,49],[-67,49],[-66,25],[-81,25],[-97,26],[-117,32],[-125,42]]},
{name:"Mexico",poly:[[-117,32],[-86,22],[-91,15],[-104,16],[-111,24]]},
{name:"Brazil",poly:[[-73,5],[-35,-5],[-39,-22],[-53,-34],[-70,-18]]},
{name:"Argentina",poly:[[-73,-22],[-54,-25],[-58,-55],[-70,-52],[-73,-36]]},
{name:"United Kingdom",poly:[[-8,58],[2,57],[1,50],[-6,50],[-8,54]]},
{name:"Ireland",poly:[[-10,55],[-6,55],[-6,51],[-10,51]]},
{name:"France",poly:[[-5,51],[8,50],[7,43],[1,42],[-5,46]]},
{name:"Spain",poly:[[-9,43],[3,43],[2,36],[-8,37]]},
{name:"Germany",poly:[[5,55],[15,54],[15,47],[7,47]]},
{name:"Italy",poly:[[7,46],[14,45],[18,39],[15,36],[10,42]]},
{name:"South Africa",poly:[[16,-22],[33,-25],[31,-35],[18,-35],[15,-29]]},
{name:"Russia",poly:[[30,70],[180,66],[170,50],[110,45],[70,50],[30,58]]},
{name:"India",poly:[[68,35],[90,28],[88,8],[77,7],[68,23]]},
{name:"China",poly:[[74,49],[132,49],[123,22],[103,18],[78,28]]},
{name:"Japan",poly:[[130,44],[146,43],[143,31],[132,32]]},
{name:"Australia",poly:[[113,-11],[154,-16],[151,-39],[115,-36],[112,-22]]},
{name:"New Zealand",poly:[[166,-34],[179,-37],[174,-47],[166,-44]]}
];
const E=["name","city","country","lat","lon","strokes","par","note"].reduce((o,id)=>(o[id]=$(id),o),{});
let photo=null,centerLon=-10,centerLat=18,drag=null,marks=[],data=[],sel=null,currentUser=null,authMode="login";
let world={ready:false,error:false,countries:[],borders:null,graticule:null,major:["China","United States of America","United Kingdom","Australia","Japan","Canada","Brazil","India","Russia","South Africa","France","Germany","Argentina","New Zealand"]};
function makeId(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function seed(){return courses.slice(0,3).map(c=>({id:makeId(),name:c[0],city:c[1],country:c[2],lat:c[3],lon:c[4],strokes:c[5],par:c[6],note:c[7],photo:null,date:"2026-05-11"}))}
function readJSON(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||"null");return v??fallback}catch{return fallback}}
function dataKey(){return currentUser?`golfglobe.user.${encodeURIComponent(currentUser.username)}.checkins.v2`:GUEST_KEY}
function loadData(){if(location.search.includes("fresh=1"))localStorage.removeItem(dataKey());let stored=readJSON(dataKey(),null);if(!stored&&currentUser){stored=readJSON(GUEST_KEY,null)}if(!stored&&!currentUser){stored=readJSON(LEGACY_KEY,null)}return stored&&stored.length?stored:seed()}
function save(){localStorage.setItem(dataKey(),JSON.stringify(data))}
function accounts(){return readJSON(AUTH_KEY,{})}
function saveAccounts(v){localStorage.setItem(AUTH_KEY,JSON.stringify(v))}
async function digest(text){if(crypto?.subtle){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("")}return btoa(unescape(encodeURIComponent(text)))}
function sessionUser(){const s=readJSON(SESSION_KEY,null),a=accounts();return s&&a[s.username]?{username:s.username,display:a[s.username].display||s.username}:null}
function setSession(username){const a=accounts();localStorage.setItem(SESSION_KEY,JSON.stringify({username}));currentUser={username,display:a[username].display||username}}
function clearSession(){localStorage.removeItem(SESSION_KEY);currentUser=null}
function toast(t){$("toast").textContent=t;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),1800)}
function score(x){let d=Number(x.strokes)-Number(x.par);return d?d>0?`+${d}`:String(d):"E"}
function loc(x){return[x.city,x.country].filter(Boolean).join(", ")}
function countryName(name){return COUNTRY_ZH[name]||name||"-"}
function normalizeCountry(name){return String(name||"").trim().toLowerCase()}
function countryTargets(name){return (COUNTRY_ALIASES[name]||[name]).map(normalizeCountry)}
function countryMatch(featureName,userCountry){return countryTargets(userCountry).includes(normalizeCountry(featureName))}
function formatCoord(lat,lon){const la=Number(lat),lo=Number(lon);if(!Number.isFinite(la)||!Number.isFinite(lo))return"-";return`${Math.abs(la).toFixed(4)}°${la>=0?"N":"S"}, ${Math.abs(lo).toFixed(4)}°${lo>=0?"E":"W"}`}
function geoMeta(lat,lon){const la=Number(lat),lo=Number(lon);if(!Number.isFinite(la)||!Number.isFinite(lo))return"-";const hemi=`${la>=0?"北":"南"}半球 · ${lo>=0?"东":"西"}经`;const tz=Math.round(lo/15);return`${hemi} · UTC${tz>=0?"+":""}${tz}`}
function photoStyle(p){return p?` style="background-image:url('${String(p).replace(/'/g,"%27")}')"`:""}
function fill(i=0){let c=courses[i];["name","city","country"].forEach((k,j)=>E[k].value=c[j]);E.lat.value=c[3];E.lon.value=c[4];E.strokes.value=c[5];E.par.value=c[6];E.note.value=c[7]}
function updateAuthUI(){if(currentUser){$("userState").innerHTML=`<b>${esc(currentUser.display)}</b>已登录，数据按账号保存`;$("authActions").hidden=true;$("logoutBtn").hidden=false}else{$("userState").innerHTML="<b>访客模式</b>数据保存在当前浏览器";$("authActions").hidden=false;$("logoutBtn").hidden=true}}
function render(){if(!data.length){data=seed();sel=data[0]?.id;save()}let countries=new Set(data.map(x=>x.country).filter(Boolean));$("c1").textContent=data.length;$("c2").textContent=countries.size;$("c3").textContent=data.length?Math.round(data.reduce((s,x)=>s+Number(x.strokes||0),0)/data.length):"-";let s=data.find(x=>x.id===sel)||data[0];sel=s?.id;$("hint").textContent=s?`${s.name} · ${s.strokes} 杆 · ${score(s)}`:"拖动地球，点击旗帜看照片和杆数。";$("geoCourse").textContent=s?`${s.name} · ${loc(s)}`:"-";$("geoLocation").textContent=s?`${s.country||"-"} · ${formatCoord(s.lat,s.lon)}`:"-";$("geoMeta").textContent=s?geoMeta(s.lat,s.lon):(world.ready?"国家边界已加载":world.error?"内置国家轮廓已加载":"正在加载国家边界");$("list").innerHTML=data.map(x=>`<button class="card" data-id="${esc(x.id)}"><i class="thumb"${photoStyle(x.photo)}></i><span><h3>${esc(x.name)}</h3><p class="muted">${esc(loc(x))}</p><span class="score">${esc(x.strokes)} 杆 <b class="pill">${esc(score(x))}</b></span></span></button>`).join("");document.querySelectorAll(".card").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));fitCanvas();draw()}
function projectionFor(w){return d3.geoOrthographic().scale(w*.43).translate([w/2,w/2]).rotate([-centerLon,-centerLat]).clipAngle(90)}
function isVisible(lat,lon){if(!window.d3)return true;return d3.geoDistance([Number(lon),Number(lat)],[centerLon,centerLat])<=Math.PI/2}
function project(lat,lon,w){if(world.ready&&window.d3){if(!isVisible(lat,lon))return null;const p=projectionFor(w)([Number(lon),Number(lat)]);if(!p)return null;const z=Math.max(0,Math.cos(d3.geoDistance([Number(lon),Number(lat)],[centerLon,centerLat])));return{x:p[0],y:p[1],z}}let r=w*.42,c=w/2,la=Number(lat)*Math.PI/180,lo=Number(lon)*Math.PI/180,la0=centerLat*Math.PI/180,lo0=centerLon*Math.PI/180,d=lo-lo0,z=Math.sin(la0)*Math.sin(la)+Math.cos(la0)*Math.cos(la)*Math.cos(d);if(z<-.04)return null;return{x:c+r*Math.cos(la)*Math.sin(d),y:c-r*(Math.cos(la0)*Math.sin(la)-Math.sin(la0)*Math.cos(la)*Math.cos(d)),z}}
function fitCanvas(){const cv=$("globe"),r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),size=Math.max(420,Math.round((r.width||760)*dpr));if(cv.width!==size){cv.width=size;cv.height=size}}
function draw(){const cv=$("globe"),g=cv.getContext("2d"),w=cv.width;g.clearRect(0,0,w,w);if(world.ready&&window.d3&&window.topojson){drawWorld(g,w);return}drawSimpleWorld(g,w)}
function drawWorld(g,w){const projection=projectionFor(w),path=d3.geoPath(projection,g),s=data.find(x=>x.id===sel),selectedCountry=s?.country;const c=w/2,r=w*.43,water=g.createRadialGradient(c-r*.35,c-r*.45,10,c,c,r*1.1);water.addColorStop(0,"#9ee9ff");water.addColorStop(.48,"#176fa8");water.addColorStop(1,"#071833");g.beginPath();path({type:"Sphere"});g.fillStyle=water;g.fill();g.save();g.beginPath();path({type:"Sphere"});g.clip();g.fillStyle="#ffffff12";for(let i=0;i<9;i++){g.beginPath();g.ellipse(c-r*.2+i*r*.06,c-r*.28+i*r*.09,r*.78,r*.05,Math.PI*.08,0,7);g.fill()}g.beginPath();path(world.graticule);g.strokeStyle="#ffffff2d";g.lineWidth=Math.max(1,w/760);g.stroke();world.countries.forEach((f,i)=>{g.beginPath();path(f);const hit=countryMatch(f.properties.name,selectedCountry);g.fillStyle=hit?"#f0b12d":i%3===0?"#58a96a":i%3===1?"#6bbf7b":"#4f9c62";g.globalAlpha=hit?.95:.86;g.fill()});g.globalAlpha=1;g.beginPath();path(world.borders);g.strokeStyle="#0c44285f";g.lineWidth=Math.max(.7,w/900);g.stroke();drawCountryLabels(g,w,projection);g.restore();g.beginPath();path({type:"Sphere"});g.strokeStyle="#ffffffe0";g.lineWidth=Math.max(2,w/360);g.stroke();const rim=g.createRadialGradient(c,c,r*.82,c,c,r*1.05);rim.addColorStop(0,"#ffffff00");rim.addColorStop(1,"#00122666");g.beginPath();path({type:"Sphere"});g.fillStyle=rim;g.fill();drawMarkers(g,w)}
function centroid(poly){let lon=0,lat=0;poly.forEach(p=>(lon+=p[0],lat+=p[1]));return[lon/poly.length,lat/poly.length]}
function drawPoly(g,w,poly,fill,stroke){let started=false,count=0;g.beginPath();poly.forEach(([lon,lat])=>{const p=project(lat,lon,w);if(!p){started=false;return}started?g.lineTo(p.x,p.y):(g.moveTo(p.x,p.y),started=true);count++});if(count<3)return;g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=stroke;g.lineWidth=Math.max(1,w*.0016);g.stroke()}
function drawSimpleWorld(g,w){const c=w/2,r=w*.43,water=g.createRadialGradient(c-r*.35,c-r*.42,20,c,c,r*1.18);water.addColorStop(0,"#9ee9ff");water.addColorStop(.5,"#217eb5");water.addColorStop(1,"#061331");g.fillStyle=water;g.beginPath();g.arc(c,c,r,0,7);g.fill();g.save();g.beginPath();g.arc(c,c,r,0,7);g.clip();for(let a=-60;a<=60;a+=30)line([...Array(73)].map((_,i)=>[a,-180+i*5]),"#ffffff32",Math.max(1,w*.0014));for(let a=-180;a<=180;a+=30)line([...Array(37)].map((_,i)=>[-90+i*5,a]),"#ffffff24",Math.max(1,w*.0012));const selected=data.find(x=>x.id===sel)?.country;SIMPLE_COUNTRIES.forEach((country,i)=>{const cen=centroid(country.poly);if(!project(cen[1],cen[0],w))return;const hit=countryMatch(country.name,selected);drawPoly(g,w,country.poly,hit?"#f0b12d":i%3===0?"#5cad69":i%3===1?"#73bd72":"#4d9c5d","#0b3a235f")});drawSimpleLabels(g,w,selected);g.restore();g.strokeStyle="#ffffffe0";g.lineWidth=Math.max(2,w*.004);g.beginPath();g.arc(c,c,r,0,7);g.stroke();const rim=g.createRadialGradient(c,c,r*.78,c,c,r*1.05);rim.addColorStop(0,"#ffffff00");rim.addColorStop(1,"#00122666");g.fillStyle=rim;g.beginPath();g.arc(c,c,r,0,7);g.fill();drawMarkers(g,w)}
function drawSimpleLabels(g,w,selected){const names=new Set(["United States of America","United Kingdom","France","South Africa","China","Japan","Australia","Brazil"]);if(selected)(COUNTRY_ALIASES[selected]||[selected]).forEach(n=>names.add(n));g.textAlign="center";g.textBaseline="middle";g.font=`${Math.max(11,w*.017)}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;SIMPLE_COUNTRIES.forEach(country=>{if(!names.has(country.name))return;const [lon,lat]=centroid(country.poly),p=project(lat,lon,w);if(!p)return;g.lineWidth=Math.max(3,w*.005);g.strokeStyle="#082315cc";g.strokeText(countryName(country.name),p.x,p.y);g.fillStyle=countryMatch(country.name,selected)?"#fff2bc":"#f6fff7";g.fillText(countryName(country.name),p.x,p.y)})}
function drawCountryLabels(g,w,projection){const selected=data.find(x=>x.id===sel)?.country,names=new Set(world.major);if(selected)(COUNTRY_ALIASES[selected]||[selected]).forEach(n=>names.add(n));g.textAlign="center";g.textBaseline="middle";g.font=`${Math.max(12,w*.018)}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;world.countries.forEach(f=>{if(!names.has(f.properties.name))return;const cen=d3.geoCentroid(f);if(!isVisible(cen[1],cen[0]))return;const p=projection(cen);if(!p)return;const label=countryName(f.properties.name);g.lineWidth=Math.max(3,w*.006);g.strokeStyle="#082315cc";g.strokeText(label,p[0],p[1]);g.fillStyle=countryMatch(f.properties.name,selected)?"#fff2bc":"#f6fff7";g.fillText(label,p[0],p[1])})}
function drawMarkers(g,w){marks=[];data.forEach(x=>{let p=project(+x.lat,+x.lon,w);if(!p)return;marks.push({...p,id:x.id});g.save();g.globalAlpha=.52+p.z*.48;g.fillStyle="#fff";g.beginPath();g.arc(p.x,p.y,w*.026,0,7);g.fill();g.strokeStyle=x.id===sel?"#f0b12d":"#ffffff";g.lineWidth=x.id===sel?Math.max(4,w*.006):Math.max(2,w*.004);g.stroke();g.fillStyle="#e94f3d";g.font=`${Math.max(18,w*.034)}px sans-serif`;g.fillText("⚑",p.x-w*.015,p.y+w*.013);if(x.id===sel){g.font=`700 ${Math.max(11,w*.015)}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;g.textAlign="center";g.strokeStyle="#072315";g.lineWidth=4;g.strokeText(x.country||x.name,p.x,p.y-w*.038);g.fillStyle="#fff";g.fillText(x.country||x.name,p.x,p.y-w*.038)}g.restore()})}
function line(arr,col,lw){let g=$("globe").getContext("2d"),on=0;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();arr.forEach(a=>{let p=project(a[0],a[1],$("globe").width);if(!p){on=0;return}on?g.lineTo(p.x,p.y):(g.moveTo(p.x,p.y),on=1)});g.stroke()}
function invertSimple(x,y,w){const r=w*.42,c=w/2,xx=(x-c)/r,yy=(c-y)/r,rho=Math.hypot(xx,yy),lat0=centerLat*Math.PI/180,lon0=centerLon*Math.PI/180;if(rho>1)return null;if(rho<1e-6)return[centerLon,centerLat];const ang=Math.asin(rho),lat=Math.asin(Math.cos(ang)*Math.sin(lat0)+yy*Math.sin(ang)*Math.cos(lat0)/rho),lon=lon0+Math.atan2(xx*Math.sin(ang),rho*Math.cos(lat0)*Math.cos(ang)-yy*Math.sin(lat0)*Math.sin(ang));return[((lon*180/Math.PI+540)%360)-180,lat*180/Math.PI]}
function inPoly(point,poly){const x=point[0],y=point[1];let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!=(yj>y))&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inside=!inside}return inside}
function inspectCountry(x,y){if(world.ready&&window.d3){const cv=$("globe"),g=cv.getContext("2d"),projection=projectionFor(cv.width),path=d3.geoPath(projection,g),coord=projection.invert([x,y]);if(!coord||!isVisible(coord[1],coord[0]))return null;let found=null;for(const f of world.countries){g.beginPath();path(f);if(g.isPointInPath(x,y)){found=f;break}}return{coord,country:found?.properties.name}}const coord=invertSimple(x,y,$("globe").width);if(!coord)return null;const found=SIMPLE_COUNTRIES.find(c=>inPoly(coord,c.poly));return{coord,country:found?.name}}
function openDetail(idv){let x=data.find(i=>i.id===idv);if(!x)return;sel=x.id;render();$("detail").innerHTML=`<div class="cover"${photoStyle(x.photo)}></div><div class="body"><h2>${esc(x.name)}</h2><p class="muted">${esc(loc(x))}</p><div class="detailGrid"><div><small>本次杆数</small><b>${esc(x.strokes)}</b></div><div><small>标准杆</small><b>${esc(x.par)}</b></div><div><small>相对标准杆</small><b>${esc(score(x))}</b></div></div><p>${esc(x.note||"这次还没有写备注。")}</p><p class="muted">${esc(formatCoord(x.lat,x.lon))} · ${esc(geoMeta(x.lat,x.lon))}</p></div>`;$("dlg").showModal()}
async function loadWorld(){try{if(!window.d3||!window.topojson)throw new Error("geo libraries unavailable");const topology=await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");world.countries=topojson.feature(topology,topology.objects.countries).features.map(f=>(f.properties={...f.properties,name:f.properties?.name||String(f.id)},f));world.borders=topojson.mesh(topology,topology.objects.countries,(a,b)=>a!==b);world.graticule=d3.geoGraticule10();world.ready=true;world.error=false;render()}catch(e){world.error=true;render()}}
function openAuth(mode){authMode=mode;$("authTitle").textContent=mode==="register"?"注册":"登录";$("authSubmit").textContent=mode==="register"?"注册并保存":"登录";$("displayNameWrap").hidden=mode!=="register";$("authMsg").textContent="";document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));$("authDlg").showModal();$("authUser").focus()}
async function handleAuth(e){e.preventDefault();const username=$("authUser").value.trim(),pass=$("authPass").value,display=$("authDisplay").value.trim()||username,msg=$("authMsg");if(!/^[\w.-]{3,24}$/.test(username)){msg.textContent="用户名需为 3-24 位字母、数字、下划线或点。";return}if(pass.length<6){msg.textContent="密码至少 6 位。";return}const a=accounts(),hash=await digest(`${username}:${pass}`);if(authMode==="register"){if(a[username]){msg.textContent="这个用户名已经注册。";return}a[username]={display,hash,createdAt:new Date().toISOString()};saveAccounts(a);setSession(username);if(!localStorage.getItem(dataKey()))localStorage.setItem(dataKey(),JSON.stringify(data.length?data:seed()));data=loadData();sel=data[0]?.id;$("authDlg").close();updateAuthUI();render();toast("注册成功，数据已保存到账号")}else{if(!a[username]||a[username].hash!==hash){msg.textContent="用户名或密码不正确。";return}setSession(username);data=loadData();sel=data[0]?.id;$("authDlg").close();updateAuthUI();render();toast("已登录")}}
function readPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader;reader.onerror=reject;reader.onload=()=>{const img=new Image;img.onerror=reject;img.onload=()=>{const max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),cv=document.createElement("canvas"),g=cv.getContext("2d");cv.width=w;cv.height=h;g.drawImage(img,0,0,w,h);resolve(cv.toDataURL("image/jpeg",.84))};img.src=reader.result};reader.readAsDataURL(file)})}
function tab(t){document.body.dataset.tab=t;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));setTimeout(()=>{fitCanvas();draw()},50)}
$("preset").innerHTML=courses.map((c,i)=>`<option value="${i}">${esc(c[0])}</option>`).join("");
$("preset").onchange=e=>fill(+e.target.value);
fill();
$("addBtn").onclick=()=>tab("form");
$("reset").onclick=()=>{data=seed();sel=data[0].id;save();render();toast("示例已重置")};
$("photo").onchange=async e=>{let f=e.target.files[0];if(!f)return;photo=await readPhoto(f);$("preview").style.backgroundImage=`url(${photo})`;$("preview").textContent=""};
$("form").onsubmit=e=>{e.preventDefault();let x={id:makeId(),photo,date:new Date().toISOString().slice(0,10)};Object.keys(E).forEach(k=>x[k]=E[k].value.trim());x.lat=+x.lat;x.lon=+x.lon;x.strokes=+x.strokes;x.par=+x.par;data.unshift(x);sel=x.id;photo=null;$("preview").removeAttribute("style");$("preview").textContent="选择照片";save();render();tab("globe");toast("已保存打卡")};
$("closeDetail").onclick=()=>$("dlg").close();
$("loginBtn").onclick=()=>openAuth("login");
$("registerBtn").onclick=()=>openAuth("register");
$("authClose").onclick=()=>$("authDlg").close();
$("authForm").onsubmit=handleAuth;
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>openAuth(b.dataset.mode));
$("logoutBtn").onclick=()=>{clearSession();data=loadData();sel=data[0]?.id;updateAuthUI();render();toast("已退出")};
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$("globe").onpointerdown=e=>{const r=$("globe").getBoundingClientRect(),s=$("globe").width/r.width;drag=[e.clientX,e.clientY,centerLon,centerLat,(e.clientX-r.left)*s,(e.clientY-r.top)*s]};
$("globe").onpointermove=e=>{const cv=$("globe"),r=cv.getBoundingClientRect(),s=cv.width/r.width,x=(e.clientX-r.left)*s,y=(e.clientY-r.top)*s;if(drag){centerLon=((drag[2]-(e.clientX-drag[0])*.35+540)%360)-180;centerLat=Math.max(-65,Math.min(65,drag[3]+(e.clientY-drag[1])*.22));draw();return}const hit=inspectCountry(x,y);if(hit){$("geoMeta").textContent=`${countryName(hit.country)} · ${formatCoord(hit.coord[1],hit.coord[0])}`}};
onpointerup=()=>drag=null;
$("globe").onclick=e=>{let r=$("globe").getBoundingClientRect(),s=$("globe").width/r.width,x=(e.clientX-r.left)*s,y=(e.clientY-r.top)*s,m=marks.find(p=>Math.hypot(p.x-x,p.y-y)<$("globe").width*.04);if(m){openDetail(m.id);return}const hit=inspectCountry(x,y);if(hit){$("geoMeta").textContent=`${countryName(hit.country)} · ${formatCoord(hit.coord[1],hit.coord[0])}`}};
new ResizeObserver(()=>{fitCanvas();draw()}).observe($("globeStage"));
